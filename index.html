    .lang-btn.active { background:var(--paper2); color:var(--accent); border-color:var(--accent2); }

    .sb-item { font-size:13.5px; color:var(--ink2); margin-bottom:4px; line-height:1.55; }
    .contact-link { font-family:var(--mono); font-size:12px; color:var(--accent2); text-decoration:none; display:block; margin-bottom:3px; }
    .contact-link:hover { color:var(--accent); }

    .main { padding:3rem 3rem 3rem 2.5rem; }
    .sec-label { font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; color:var(--ink3); text-transform:uppercase; margin-bottom:1rem; padding-bottom:0.5rem; border-bottom:1px solid var(--paper3); }
    .bio { font-size:1.05rem; line-height:2; margin-bottom:1.4rem; color:var(--ink); }
    .bio em { color:var(--accent2); font-style:italic; }
    .card-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:0.5rem; }
    .card { background:var(--paper2); border:1px solid var(--paper3); border-radius:4px; padding:0.9rem 1rem; cursor:pointer; transition:border-color .2s; }
    .card:hover { border-color:var(--accent2); }
    .card-title { font-size:0.92rem; font-weight:500; margin-bottom:3px; }
    .card-desc { font-size:12.5px; color:var(--ink2); font-style:italic; line-height:1.5; }

    .page-heading { font-size:1.9rem; font-weight:400; margin-bottom:4px; }
    .page-sub { font-size:13.5px; color:var(--ink2); font-style:italic; margin-bottom:2rem; }
    .post-list { display:flex; flex-direction:column; }

const posts = [
  {
    title_ja: "言語はなぜ「隠喩」で溢れているのか",
    title_zh: "语言为何充满「隐喻」",
    title_en: "Why Is Language Full of Metaphors?",
    date: "2025.05",
    excerpt_ja: "私たちが「時間を無駄にする」と言うとき、時間をすでにモノとして捉えている——",
    excerpt_zh: "当我们说「浪费时间」时，已经把时间当作了某种可以挥霍的东西——",
    excerpt_en: "When we say we 'waste time', we are already treating time as a thing that can be spent—",
    content_ja: `<p>私たちは毎日、無数の隠喩を使いながら話している。「時間を無駄にする」「議論に勝つ」「アイデアが浮かぶ」——これらはすべて、抽象的な概念をより具体的な何かとして理解していることを示している。</p>
<p>Lakoff と Johnson は『Metaphors We Live By』の中で、隠喩は単なる言語的な装飾ではなく、私たちの思考そのものを構造化していると主張した。</p>
<blockquote>概念メタファーとは、ある概念領域を別の概念領域によって理解することである。</blockquote>
<p>例えば「議論は戦争だ」という概念メタファー。「主張を攻撃する」「防御を固める」「相手を打ち負かす」——私たちは議論を戦争として体験し、そのように語る。もし「議論はダンスだ」というメタファーで考えたとしたら、私たちの議論の仕方はどう変わるだろうか。</p>`,
    content_zh: `<p>我们每天说话时都在使用无数隐喻。「浪费时间」「赢得争论」「想法涌现」——这些都说明我们在用更具体的事物来理解抽象概念。</p>
<p>Lakoff 和 Johnson 在《我们赖以生存的隐喻》中提出，隐喻不只是语言的装饰，而是构建我们思维本身的方式。</p>
<blockquote>概念隐喻，就是用一个概念域来理解另一个概念域。</blockquote>
<p>以「争论是战争」这个概念隐喻为例。「攻击对方的论点」「巩固自己的立场」「击败对手」——我们把争论体验为战争，也这样谈论它。如果我们改用「争论是舞蹈」这个隐喻来思考，我们的争论方式会有什么不同？</p>`,
    content_en: ""
  },
  {
    title_ja: "『言語論』を読んで：サピアが与えてくれた三つの衝撃",
    title_zh: "读《语言论》：萨丕尔给我的三个震动",
    title_en: "Reading Sapir's Language: Three Revelations",
    date: "2025.04",
    excerpt_ja: "サピアは言語を「ツール」とは呼ばなかった。それは「現実への道」だと——",
    excerpt_zh: "萨丕尔没有把语言叫做「工具」。他说那是「通向现实的道路」——",
    excerpt_en: "Sapir did not call language a tool. He called it a path to reality—",
    content_ja: `<p>サピアの『言語論』第二章を読んで、思わず手が止まった。「言語はツールではなく、現実への道だ」——この言葉は一見抽象的に見えるが、続く論証を読むと、これが修辞ではなく真剣な認識論的主張だとわかる。</p>
<p>三つの衝撃を記録しておく。</p>
<h2>一、恣意性は欠陥ではない</h2>
<p>サピアによれば、言語記号の恣意性こそが、言語を体系化させる前提条件だ。これは私がずっと思っていたこととまったく逆だった。</p>
<h2>二、言語変化は「漂流」である</h2>
<blockquote>言語は常に変化している。しかしその変化には方向があり、規則がある。</blockquote>
<h2>三、翻訳の不可能性</h2>
<p>翻訳に対するサピアの悲観は、読んでいて居心地が悪かった。しかし反論もできなかった。</p>`,
    content_zh: `<p>读萨丕尔《语言论》第二章，我愣了一下。「语言不是工具，而是通向现实的道路」——这句话乍看很玄，但读完他的论证，我意识到这不是修辞，而是严肃的认识论命题。</p>
<p>记录三个最让我震动的地方。</p>
<h2>一、任意性不是缺陷</h2>
<p>萨丕尔认为语言符号的任意性正是语言得以系统化的前提。这和我之前的理解完全相反。</p>
<h2>二、语言变化是「漂移」</h2>
<blockquote>语言总在变化，但变化有方向，有规律。</blockquote>
<h2>三、翻译的不可能性</h2>
<p>萨丕尔对翻译的悲观让我不舒服，但也很难反驳。</p>`,

// Language & Navigation logic
// ═══════════════════════════════════════════
let currentLang = 'ja';

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === 'ja' ? 'ja' : lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.lang-btn').forEach(b => {
    if ((lang === 'ja' && b.textContent === '日本語') ||
        (lang === 'zh' && b.textContent === '中文') ||
        (lang === 'en' && b.textContent === 'EN')) {
      b.classList.add('active');
    }
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  renderPostList();
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function goNav(id) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
  if (id === 'notes') renderPostList();
  showPage(id);
}

function renderPostList() {
  const container = document.getElementById('post-list');
  const wip = i18n[currentLang]['wip'] || 'TL pending';
  container.innerHTML = posts.map((p, i) => {
    const title = p['title_' + currentLang] || p.title_ja;
    const excerpt = p['excerpt_' + currentLang] || p['excerpt_ja'];
    const hasContent = !!(p['content_' + currentLang]);
    const wipBadge = !hasContent ? `<span class="wip">${wip}</span>` : '';
    return `<div class="post-row" onclick="showPost(${i})">
      <span class="post-n">${String(i+1).padStart(2,'0')}</span>
      <span class="post-title">${title}${wipBadge}</span>
      <span class="post-date">${p.date}</span>
      <span class="post-exc">${excerpt}</span>
    </div>`;
  }).join('');
}

function showPost(i) {
  const p = posts[i];
  const lang = currentLang;
  const title = p['title_' + lang] || p.title_ja;
  const content = p['content_' + lang] || p['content_ja'];
  document.getElementById('post-title').textContent = title;
  document.getElementById('post-date').textContent = p.date;
  if (content) {
    document.getElementById('post-body').innerHTML = content;
  } else {
    const fallbackLang = lang === 'zh' ? 'ja' : 'zh';
    const fallback = p['content_' + fallbackLang] || p.content_ja;
    const wipMsg = lang === 'zh' ? '※ 翻译尚未完成，以下为日文原文。'
                  : lang === 'en' ? '※ Translation pending. Showing original below.'
                  : '';
    document.getElementById('post-body').innerHTML =
      `<p style="font-family:var(--mono);font-size:12px;color:var(--ink3);margin-bottom:1.5rem">${wipMsg}</p>` + fallback;
  }
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.getElementById('nav-notes').classList.add('active');
  showPage('post');
}

// Init
setLang('ja');
</script>
</body>
</html>
